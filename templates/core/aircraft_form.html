
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KOIS | Register Aircraft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark px-4" style="background:#10243a">
    <a class="navbar-brand fw-bold" href="{% url 'core:booking_admin_home' %}">KENYA AIRFORCE OPERATIONS INFORMATION SYSTEM (KOIS)</a>
    <span class="text-white">Service Number: {{ request.user.username }}</span>
    <form method="post" action="{% url 'core:logout' %}">
        {% csrf_token %}
        <button class="btn btn-outline-light btn-sm">Logout</button>
    </form>
</nav>

<main class="container py-4">
    <div class="card shadow-sm mx-auto" style="max-width:700px">
        <div class="card-body p-4">
            <h2>Register Aircraft</h2>
            <p class="text-muted">Enter the aircraft's details below.</p>

            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Aircraft Name / Model</label>
                    <input class="form-control" name="name" required maxlength="150">
                </div>
                <div class="mb-3">
                    <label class="form-label">Tail Number</label>
                    <input class="form-control" name="tail_number" required maxlength="30">
                </div>
                <div class="mb-3">
                    <label class="form-label">Passenger Capacity</label>
                    <input class="form-control" type="number" name="passenger_capacity" min="1" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Maximum Payload (kg)</label>
                    <input class="form-control" type="number" name="maximum_payload_kg" min="0" step="0.01" value="0" required>
                </div>

                <button class="btn btn-primary" type="submit">Save Aircraft</button>
                <a class="btn btn-outline-secondary" href="{% url 'core:aircraft_list' %}">Cancel</a>
            </form>
        </div>
    </div>
</main>
</body>
</html>
